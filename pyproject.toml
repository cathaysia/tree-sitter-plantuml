[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-plantuml"
description = "Plantuml grammar for tree-sitter"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "plantuml"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "loongtao.zhang", email = "loongtao.zhang@outlook.com" }]
requires-python = ">=3.9"
license.text = "Apache 2.0"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/cathaysia/tree-sitter-plantuml"

[project.optional-dependencies]
core = ["tree-sitter~=0.22"]

[tool.cibuildwheel]
build = "cp39-*"
build-frontend = "build"
