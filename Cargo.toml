[package]
name = "tree-sitter-plantuml"
description = "Plantuml grammar for tree-sitter"
version = "0.1.0"
authors = ["loongtao.zhang <loongtao.zhang@outlook.com>"]
license = "Apache 2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "plantuml"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/cathaysia/tree-sitter-plantuml"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.24.4"
